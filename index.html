<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Login Form</title>
</head>

<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <div class="bg-gray-300 p-8 rounded-xl shadow-lg w-full max-w-md">

        <h2 class="text-3xl font-bold text-center text-blue-900 mb-2">
            Welcome Back
        </h2>

        <p class="text-center text-gray-500 mb-6">
            Login to your account
        </p>


        <!-- form -->
        <form>
            <div class="mb-4">
                <label class="block text-gray-700 font-medium mb-2">
                    Email
                </label>

                <input type="email" placeholder="Enter your email" required
                    class="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <!-- Password -->
            <div class="mb-6">
                <label class="block text-gray-700 font-medium mb-2">
                    Password
                </label>

                <input type="password" placeholder="Enter your password" required
                    class="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <!-- Remember -->
            <div class="flex justify-between items-center mb-6">

                <label class="flex items-center gap-2">
                    <input type="checkbox">
                    <span class="text-sm text-gray-600">Remember me</span>
                </label>

                <a href="#" class="text-blue-900 hover:underline text-sm">
                    Forgot Password?
                </a>
            </div>

            <!-- Login Button -->
            <button class="w-full bg-blue-900 text-white py-3 rounded-lg hover:bg-blue-400 transition duration-300">
                Login
            </button>

        </form>

        <p class="text-center mt-6 text-gray-600">
            Don't have an account?
            <a href="#" class="text-blue-900 font-semibold hover:underline">
                Sign Up
            </a>
        </p>

    </div>

</body>

</html>
